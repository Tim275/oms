name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  # Change this to your GitHub username or organization
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # Detect which services changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      orders: ${{ steps.filter.outputs.orders }}
      payments: ${{ steps.filter.outputs.payments }}
      stock: ${{ steps.filter.outputs.stock }}
      kitchen: ${{ steps.filter.outputs.kitchen }}
      customer-app: ${{ steps.filter.outputs.customer-app }}
      kitchen-display: ${{ steps.filter.outputs.kitchen-display }}
      # Build all on tag push
      is_tag: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
              - 'common/**'
              - 'discovery/**'
            orders:
              - 'orders/**'
              - 'common/**'
              - 'discovery/**'
            payments:
              - 'payments/**'
              - 'common/**'
              - 'discovery/**'
            stock:
              - 'stock/**'
              - 'common/**'
              - 'discovery/**'
            kitchen:
              - 'kitchen/**'
              - 'common/**'
              - 'discovery/**'
            customer-app:
              - 'customer-app/**'
            kitchen-display:
              - 'kitchen-display/**'

  build-backend:
    name: Build Backend Services
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - gateway
          - orders
          - payments
          - stock
          - kitchen
        include:
          - service: gateway
            changed: ${{ needs.changes.outputs.gateway }}
          - service: orders
            changed: ${{ needs.changes.outputs.orders }}
          - service: payments
            changed: ${{ needs.changes.outputs.payments }}
          - service: stock
            changed: ${{ needs.changes.outputs.stock }}
          - service: kitchen
            changed: ${{ needs.changes.outputs.kitchen }}

    # Skip if no changes (unless it's a tag push)
    if: needs.changes.outputs.is_tag == 'true' || matrix.changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/oms-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-frontend:
    name: Build Frontend Apps
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - customer-app
          - kitchen-display
        include:
          - app: customer-app
            changed: ${{ needs.changes.outputs.customer-app }}
          - app: kitchen-display
            changed: ${{ needs.changes.outputs.kitchen-display }}

    # Skip if no changes (unless it's a tag push)
    if: needs.changes.outputs.is_tag == 'true' || matrix.changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/oms-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            REACT_APP_API_URL=http://api.oms.timourhomelab.org/api

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Services Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ gateway" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ orders" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ payments" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ stock" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ kitchen" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Apps Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ customer-app" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ kitchen-display" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Images pushed to:" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository_owner }}/oms-*:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Update Kubernetes manifests to use ghcr.io images" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy to cluster: \`kubectl apply -k overlays/production\`" >> $GITHUB_STEP_SUMMARY
